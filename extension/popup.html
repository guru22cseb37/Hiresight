<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0A0A0F;
      color: #F8FAFC;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3B82F6, #8B5CF6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 18px;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }
    .content {
      display: flex;
      flex-col: column;
      gap: 16px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #3B82F6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:hover {
      background: #2563EB;
      transform: translateY(-1px);
    }
    .btn:disabled {
      background: #1E1E2D;
      color: #475569;
      cursor: not-allowed;
    }
    #selection-preview {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 12px;
      font-size: 11px;
      color: #94A3B8;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 16px;
      display: none;
    }
    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 10px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div className="header">
    <div className="logo">H</div>
    <div className="title">HireSight AI</div>
  </div>

  <div className="content">
    <button id="grab-btn" className="btn">
      Grab Selected Text
    </button>
    <div id="selection-preview"></div>
    <button id="analyze-btn" className="btn" disabled style="background: #111118; border: 1px solid rgba(255,255,255,0.05); margin-top: 12px;">
      Send to Analysis
    </button>
  </div>

  <div className="footer">Powered by Groq Intelligence</div>

  <script src="popup.js"></script>
</body>
</html>
